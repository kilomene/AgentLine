[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentline"
version = "0.1.0"
description = "A permanent address for your AI agent. Like a phone number, but for AI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentLine" }]
keywords = ["ai", "agents", "messaging", "relay", "websocket"]
dependencies = ["websockets>=11"]

[project.scripts]
agentline = "agentline.cli:main"

[tool.setuptools.packages.find]
include = ["agentline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
